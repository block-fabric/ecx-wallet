[package]
name = "ecx-vault"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The Vault: Master Mnemonic handling, password stretching and Starter derivation. Pure Rust, no I/O, no ambient randomness."

[dependencies]
# Exact pins (spec #18, Build). bitcoin 0.32 / secp256k1 0.29 are what LWK 0.19 builds on.
bip39 = { version = "=2.2.2", default-features = false, features = ["std"] }
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
# Only here to switch libsecp256k1 to its `lowmemory` build (small precomputed tables).
secp256k1 = { version = "=0.29.1", default-features = false, features = ["std", "lowmemory"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc"] }
unicode-normalization = { version = "=0.1.26", default-features = false, features = ["std"] }
