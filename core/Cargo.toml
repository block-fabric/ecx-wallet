# The signing core: pure-Rust libraries plus one thin C-ABI crate per `.wasm`.
# No wasm-bindgen anywhere: each module's `.wasm` imports nothing (see README.md).
[workspace]
resolver = "2"
members = ["abi", "chain-entry", "vault", "vault-wasm", "elements", "elements-wasm", "l1", "l1-wasm", "flush", "flush-wasm"]

[workspace.package]
edition = "2021"
publish = false
license = "MIT"

# crates.io lwk_common 0.19.0 with one line changed: getrandom's forced `js` backend becomes
# `custom`, so Chain Module .wasm files import nothing (see core/README.md).
[patch.crates-io]
lwk_common = { path = "vendor/lwk_common" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
